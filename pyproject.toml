[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "lzcomplexity"
version = "1.0.2" # x-release-please-version
description = "LempelZiv-76 complexity engine. Suited for complexity analysis of time series."
authors = [
    { name = "Efrén Aragón Pérez", email = "efrenaragon96@gmail.com" },
    { name = "Daniel Estévez Moya", email = "kemossabee@gmail.com" },
    { name = "Ernesto Estévez Rams", email = "estevez@fisica.uh.cu" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/pleros-ai/lzcomplexity"
Repository = "https://github.com/pleros-ai/lzcomplexity"
Changelog = "https://github.com/pleros-ai/lzcomplexity/releases"
Issues = "https://github.com/pleros-ai/lzcomplexity/issues"

[tool.maturin]
manifest-path = "crates/lzcomplexity-py/Cargo.toml"
module-name = "lzcomplexity.lzcomplexity"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true
