name: Release

# Scoped to the Rust branch: this is where the Python package is released from.
# `main` (the C++ backend) is kept only as a verification reference and is not
# published by this workflow.
on:
  push:
    branches: ["rust-backend"]

permissions: {}

jobs:
  # ── 1. Maintain the release PR; cut a release when it merges ────────────────
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          target-branch: rust-backend
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── 2. Build abi3 wheels (one per platform covers Python ≥ 3.9) ─────────────
  build-wheels:
    name: Wheel • ${{ matrix.os }} • ${{ matrix.target }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: "" }
          - { os: macos-13, target: x86_64, manylinux: "" }
          - { os: macos-14, target: aarch64, manylinux: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── 3. Publish to PyPI via OIDC trusted publishing (no token) ───────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [release-please, build-wheels, build-sdist]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publisher configured at:
        # https://pypi.org/manage/project/lzcomplexity/settings/publishing/
        with:
          packages-dir: dist

  # ── 4. Attach standalone binaries to the GitHub release ─────────────────────
  build-binaries:
    name: Binaries • ${{ matrix.target }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, suffix: linux-x86_64 }
          - { os: macos-14, target: aarch64-apple-darwin, suffix: macos-arm64 }
          - { os: macos-13, target: x86_64-apple-darwin, suffix: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: windows-x86_64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p lzcomplexity-cli --target ${{ matrix.target }}
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p out
          bindir="target/${{ matrix.target }}/release"
          tag="${{ needs.release-please.outputs.tag_name }}"
          for b in lzcomplexity lzdistance; do
            cp "$bindir/$b${{ matrix.ext }}" "out/$b-$tag-${{ matrix.suffix }}${{ matrix.ext }}"
          done
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" out/* --clobber
