name: Release

# Scoped to the Rust branch: this is where the Python package is released from.
# `main` (the C++ backend) is kept only as a verification reference and is not
# published by this workflow.
on:
  push:
    branches: ["rust-backend"]
  # Manual escape hatch: build wheels and publish the CURRENT version to PyPI
  # (and re-attach binaries to its release) without waiting on release-please —
  # useful for recovery or the first bootstrap publish.
  workflow_dispatch:

permissions: {}

jobs:
  # ── 1. Maintain the release PR; cut a release when it merges ────────────────
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      # In manifest mode release-please exposes per-package details on a
      # path-prefixed output (`.--tag_name`); the bare `tag_name` is empty.
      tag_name: ${{ steps.rp.outputs.tag_name || steps.rp.outputs['.--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          target-branch: rust-backend
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── 2. Build abi3 wheels (one per platform covers Python ≥ 3.9) ─────────────
  build-wheels:
    name: Wheel • ${{ matrix.os }} • ${{ matrix.target }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS x86_64 is cross-compiled on the Apple-Silicon runner so the
        # pipeline never depends on scarce macos-13 (Intel) runners.
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: "" }
          - { os: macos-14, target: aarch64, manylinux: "" }
          - { os: macos-14, target: x86_64, manylinux: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── 3. Publish to PyPI via OIDC trusted publishing (no token) ───────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [release-please, build-wheels, build-sdist]
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publisher configured at:
        # https://pypi.org/manage/project/lzcomplexity/settings/publishing/
        with:
          packages-dir: dist

  # ── 4. Attach standalone binaries to the GitHub release ─────────────────────
  build-binaries:
    name: Binaries • ${{ matrix.target }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, suffix: linux-x86_64 }
          - { os: macos-14, target: aarch64-apple-darwin, suffix: macos-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, suffix: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: windows-x86_64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p lzcomplexity-cli --target ${{ matrix.target }}
      - name: Package binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null)
          fi
          [ -z "$tag" ] && tag="dev"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p out
          bindir="target/${{ matrix.target }}/release"
          for b in lzcomplexity lzdistance; do
            cp "$bindir/$b${{ matrix.ext }}" "out/$b-$tag-${{ matrix.suffix }}${{ matrix.ext }}"
          done
      # Binaries are always published as workflow artifacts (retained per repo
      # policy) so they are available regardless of release immutability.
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error
      # Best-effort attach to the GitHub release. If the org has "immutable
      # releases" enabled, assets cannot be added after creation (HTTP 422) —
      # that is non-fatal here; the artifacts above remain the source of truth.
      - name: Attach to release (best-effort)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" out/* --clobber \
            || echo "::warning::Could not attach binaries to release $TAG (immutable release?). Use the workflow artifacts instead."
