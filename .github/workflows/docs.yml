name: Docs

# Documentation is maintained beside the current library. PRs build only;
# the permitted docs deployment branch publishes to GitHub Pages.
on:
  push:
    branches: ["rust-backend", "docs"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "overrides/**"
      - "scripts/docs/**"
      - "tests/docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "overrides/**"
      - "scripts/docs/**"
      - "tests/docs/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # `--strict` turns broken internal links and bad nav entries into build
      # failures, so a typo can never ship silently.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/docs/test-demo.cjs
      - run: mkdocs build --strict
      - run: python scripts/docs/check-links.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/docs'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `enablement: true` creates the Pages site on first run, so no manual
      # repository-settings step is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
