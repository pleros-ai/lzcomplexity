[workspace]
resolver = "2"
members = [
    "crates/lzcomplexity-core",
    "crates/lzcomplexity-py",
    "crates/lzcomplexity-cli",
]

[workspace.package]
version = "0.12.0" # x-release-please-version
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = [
    "Efren Aragon Perez <efrenaragon96@gmail.com>",
    "Ernesto Estevez Rams <estevez@fisica.uh.cu>",
]
repository = "https://github.com/pleros-ai/lzcomplexity"

[workspace.dependencies]
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
cdivsufsort = "2.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
