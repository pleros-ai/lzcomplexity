site_name: lzcomplexity
site_description: Measure randomness, structure across scales and similarity in symbolic sequences. LZ76 analysis for Python, Rust and the command line, from Pleros.
site_url: https://pleros-ai.github.io/lzcomplexity/
repo_url: https://github.com/pleros-ai/lzcomplexity
repo_name: GitHub
edit_uri: edit/rust-backend/docs/
copyright: © Pleros Group · MIT licensed

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg

  # Typography uses local system fonts; no Google Fonts dependency.
  font: false

  language: en
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark

    # Cool neutral surfaces and blue accents in both color schemes.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light

  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

extra_css:
  - assets/extra.css
  - assets/cheatsheet.css

extra_javascript:
  - assets/measure-engine.js
  - assets/site.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pleros-ai/lzcomplexity
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/lzcomplexity/
    - icon: simple/rust
      link: https://crates.io/crates/lzcomplexity-core
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "&para;"
      permalink_title: Link to this section
      toc_depth: 3

  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      # Server-side highlighting — no highlight.js fetched from a CDN.
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.tilde

hooks:
  - scripts/docs/asset-versions.py
  - scripts/docs/render-math.py

plugins:
  - search

nav:
  - Home: index.md

  - Documentation:
      - Getting started:
          - Overview: guide/index.md
          - Install: guide/install.md
          - Your first factorization: guide/first-factorization.md
          - Reading the numbers: guide/reading-the-numbers.md
          - Troubleshooting: guide/troubleshooting.md
          - Python usage cheatsheet: guide/quick-reference.md
      - Understanding the results:
          - LZ76 factorization: concepts/lz76.md
          - Entropy density (h): concepts/entropy-density.md
          - Effective measure complexity (E): concepts/emc.md
          - Information distance (NID): concepts/nid.md
          - Alphabets and log bases: concepts/alphabets.md
          - Sequence length and convergence: concepts/convergence.md
      - Recipes:
          - Neural time-series: recipes/neuro.md
          - DNA and FASTA: recipes/genomics.md
          - The route to chaos: recipes/dynamical-systems.md
          - Comparing many sequences: recipes/batch-distance.md

  - API reference:
      - Python library:
          - Overview: api/python.md
          - factorization: api/functions/factorization.md
          - h: api/functions/h.md
          - emc: api/functions/emc.md
          - nid: api/functions/nid.md
          - lz76: api/functions/lz76.md
      - Input types: api/inputs.md
      - Rust library:
          - Overview: api/rust.md
          - Analysis functions: api/rust/analysis.md
          - Sequence: api/rust/sequence.md
          - Configuration and results: api/rust/types.md
          - Building blocks: api/rust/building-blocks.md

  - Command line:
      - Overview: cli/index.md
      - lzcomplexity: cli/lzcomplexity.md
      - lzdistance: cli/lzdistance.md
      - Input formats: cli/formats.md
      - CLI usage cheatsheet: cli/quick-reference.md

  - Project:
      - Authors and citation: project/authors.md
      - Performance: project/performance.md
      - Inside the implementation: concepts/implementation.md
      - Determinism: project/determinism.md
      - Migration reference: project/cpp-parity.md
      - Releases: project/releases.md
      - Original manual: project/manual.md
      - References: project/references.md
      - Contributing: project/contributing.md
