<svg xmlns="http://www.w3.org/2000/svg" width="480" height="664" viewBox="0 0 480 664" role="img" aria-labelledby="title description">
  <title id="title">One sequence, six LZ76 factors</title>
  <desc id="description">ABRACADABRA! splits into A, B, R, AC, AD and ABRA!: six LZ76 factors. Blue letters and arrows show reuse of A and ABRA. h describes randomness, E describes correlations across ranges, and d compares two sequences.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
    <linearGradient id="tile" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7faff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#7ea6df" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x=".5" y=".5" width="479" height="663" rx="23" fill="url(#paper)" stroke="#dfe7f1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#20314b">
    <text x="28" y="38" font-size="11" font-weight="600" letter-spacing="1.2" fill="#647891">LEMPEL–ZIV FACTORIZATION</text>
    <text x="28" y="76" font-size="26" font-weight="600" letter-spacing="-.6">One sequence, six factors</text>
    <text x="28" y="119" font-size="11" font-weight="600" letter-spacing="1.3" fill="#647891">INPUT</text>
    <text x="452" y="119" text-anchor="end" font-size="12" fill="#647891">12 symbols</text>
    <rect x="28" y="134" width="424" height="60" rx="14" fill="#fff" stroke="#dfe7f1"/>
    <rect x="50" y="147" width="96" height="34" rx="8" fill="#e9f1fd"/>
    <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="500" text-anchor="middle">
      <g fill="#326fc1"><text x="62" y="172">A</text><text x="86" y="172">B</text><text x="110" y="172">R</text><text x="134" y="172">A</text></g>
      <text x="158" y="172">C</text><text x="182" y="172">A</text><text x="206" y="172">D</text><text x="230" y="172">A</text><text x="254" y="172">B</text><text x="278" y="172">R</text><text x="302" y="172">A</text><text x="326" y="172">!</text>
    </g>
    <path d="M98 194C98 231 402 220 402 269" fill="none" stroke="#7ea6df" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="267" y="218" font-size="12" fill="#5a7fad">reuse ABRA</text>
    <text x="28" y="253" font-size="11" font-weight="600" letter-spacing="1.3" fill="#647891">FACTORS</text>
    <g fill="url(#tile)" stroke="#dce5f1">
      <rect x="28" y="278" width="48" height="56" rx="12"/>
      <rect x="88" y="278" width="48" height="56" rx="12"/>
      <rect x="148" y="278" width="48" height="56" rx="12"/>
      <rect x="208" y="278" width="66" height="56" rx="12"/>
      <rect x="286" y="278" width="66" height="56" rx="12"/>
      <rect x="364" y="278" width="88" height="56" rx="12"/>
    </g>
    <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="500" text-anchor="middle">
      <text x="52" y="313">A</text><text x="112" y="313">B</text><text x="172" y="313">R</text>
      <text x="241" y="313"><tspan fill="#326fc1">A</tspan><tspan>C</tspan></text>
      <text x="319" y="313"><tspan fill="#326fc1">A</tspan><tspan>D</tspan></text>
      <text x="408" y="313"><tspan fill="#326fc1">ABRA</tspan><tspan>!</tspan></text>
    </g>
    <path d="M52 336C52 380 235 380 235 336" fill="none" stroke="#7ea6df" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="122" y="387" font-size="12" fill="#5a7fad">reuse A</text>
    <g fill="#fff" stroke="#dfe7f1">
      <rect x="28" y="410" width="424" height="70" rx="14"/>
      <rect x="28" y="488" width="424" height="70" rx="14"/>
      <rect x="28" y="566" width="424" height="70" rx="14"/>
    </g>
    <g font-size="25" font-weight="500" fill="#326fc1" text-anchor="middle">
      <text x="55" y="454" font-style="italic">h</text><text x="55" y="532">E</text><text x="55" y="610" font-style="italic">d</text>
    </g>
    <g font-size="17" font-weight="600"><text x="82" y="438">Randomness</text><text x="82" y="516">Structure</text><text x="82" y="594">Sequence distance</text></g>
    <g font-size="13.5" fill="#647891"><text x="82" y="459">New information, symbol by symbol.</text><text x="82" y="537">Correlations across different ranges.</text><text x="82" y="615">Compare the patterns of two sequences.</text></g>
  </g>
</svg>
