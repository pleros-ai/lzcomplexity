<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title description">
  <title id="title">LZ76 factorization of ABRACADABRA!</title>
  <desc id="description">Input ABRACADABRA! splits into six factors: A, B, R, AC, AD and ABRA!. Blue marks the earlier matching prefixes A and ABRA. Teal marks their following symbols C, D and the exclamation mark. Arrows connect source ABRA to its later match and the first A to the A in AC. The first three factors remain neutral.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f2f7fa"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#8da9d1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x=".5" y=".5" width="359" height="349" rx="20" fill="url(#paper)" stroke="#dfe7ef"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#25344d">
    <text x="20" y="37" font-size="19" font-weight="600" letter-spacing="-.4">LZ76 factorization</text>
    <rect x="281" y="18" width="60" height="28" rx="9" fill="#efedf9"/>
    <text x="311" y="37" text-anchor="middle" font-size="14" font-weight="500" fill="#7665ac">C = 6</text>
    <text x="20" y="78" font-size="14" fill="#6e7e92">Input</text>
    <rect x="20" y="92" width="320" height="60" rx="12" fill="#fff" stroke="#dfe7ef"/>
    <rect x="34" y="106" width="88" height="33" rx="7" fill="#eaf1fd"/>
    <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="21" font-weight="500" text-anchor="middle">
      <text x="45" y="130">A</text><text x="67" y="130">B</text><text x="89" y="130">R</text><text x="111" y="130">A</text><text x="133" y="130">C</text><text x="155" y="130">A</text><text x="177" y="130">D</text><text x="199" y="130">A</text><text x="221" y="130">B</text><text x="243" y="130">R</text><text x="265" y="130">A</text><text x="287" y="130">!</text>
    </g>
    <path d="M78 154C78 181 290 169 290 205" fill="none" stroke="#8da9d1" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="196" y="171" font-size="11" fill="#6a85ad">ABRA</text>
    <text x="20" y="198" font-size="14" fill="#6e7e92">Factors</text>
    <g fill="#fff" stroke="#dce4ef">
      <rect x="20" y="217" width="37" height="49" rx="10"/>
      <rect x="62" y="217" width="37" height="49" rx="10"/>
      <rect x="104" y="217" width="37" height="49" rx="10"/>
      <rect x="146" y="217" width="48" height="49" rx="10"/>
      <rect x="199" y="217" width="48" height="49" rx="10"/>
      <rect x="252" y="217" width="88" height="49" rx="10"/>
    </g>
    <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="500" text-anchor="middle">
      <text x="38.5" y="249">A</text><text x="80.5" y="249">B</text><text x="122.5" y="249">R</text>
      <text x="170" y="249"><tspan fill="#4779c5">A</tspan><tspan fill="#208a80">C</tspan></text>
      <text x="223" y="249"><tspan fill="#4779c5">A</tspan><tspan fill="#208a80">D</tspan></text>
      <text x="296" y="249"><tspan fill="#4779c5">ABRA</tspan><tspan fill="#208a80">!</tspan></text>
    </g>
    <path d="M38.5 268C38.5 304 164 304 164 273" fill="none" stroke="#8da9d1" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="101" y="309" text-anchor="middle" font-size="11" fill="#6a85ad">A</text>
    <circle cx="24" cy="330" r="3.5" fill="#4779c5"/><text x="34" y="334" font-size="11" fill="#6e7e92">Matched prefix</text>
    <circle cx="197" cy="330" r="3.5" fill="#208a80"/><text x="207" y="334" font-size="11" fill="#6e7e92">Next symbol</text>
  </g>
</svg>
