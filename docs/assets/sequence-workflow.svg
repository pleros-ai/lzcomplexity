<svg xmlns="http://www.w3.org/2000/svg" width="600" height="410" viewBox="0 0 600 410" role="img" aria-labelledby="title description">
  <title id="title">LZ76 factorization of ABRACADABRA!</title>
  <desc id="description">Input: ABRACADABRA!. The library produces six factors: A, B, R, AC, AD, ABRA!. In AC and AD the blue A matches the earlier A; C and D are the next symbols. In ABRA! the blue ABRA matches input positions one through four; the exclamation mark is the next symbol. Arrows connect the earlier ABRA to its later matched prefix, and the first A to the A in AC. Initial single-symbol factors A, B and R remain neutral.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#f6f9fd"/><stop offset="1" stop-color="#f2f7f8"/></linearGradient>
    <linearGradient id="tile" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbfcff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#8da9d1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x=".5" y=".5" width="599" height="409" rx="24" fill="url(#paper)" stroke="#dfe7ef"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#25344d">
    <text x="30" y="45" font-size="22" font-weight="600" letter-spacing="-.4">LZ76 factorization</text>
    <rect x="488" y="22" width="82" height="32" rx="10" fill="#efedf9"/>
    <text x="529" y="44" text-anchor="middle" font-size="16" font-weight="500" fill="#7665ac">C = 6</text>
    <text x="30" y="82" font-size="15" fill="#6e7e92">Input</text>
    <rect x="30" y="96" width="540" height="73" rx="14" fill="#fff" stroke="#dfe7ef"/>
    <rect x="67" y="114" width="128" height="36" rx="8" fill="#eaf1fd"/>
    <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="26" font-weight="500" text-anchor="middle">
      <text x="83" y="141">A</text><text x="115" y="141">B</text><text x="147" y="141">R</text><text x="179" y="141">A</text><text x="211" y="141">C</text><text x="243" y="141">A</text><text x="275" y="141">D</text><text x="307" y="141">A</text><text x="339" y="141">B</text><text x="371" y="141">R</text><text x="403" y="141">A</text><text x="435" y="141">!</text>
    </g>
    <path d="M131 171C131 202 466 190 466 227" fill="none" stroke="#8da9d1" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="315" y="191" font-size="13" fill="#6a85ad">ABRA</text>
    <text x="30" y="220" font-size="15" fill="#6e7e92">Factors</text>
    <g fill="url(#tile)" stroke="#dce4ef">
      <rect x="30" y="240" width="48" height="60" rx="13"/>
      <rect x="90" y="240" width="48" height="60" rx="13"/>
      <rect x="150" y="240" width="48" height="60" rx="13"/>
      <rect x="210" y="240" width="72" height="60" rx="13"/>
      <rect x="294" y="240" width="72" height="60" rx="13"/>
      <rect x="378" y="240" width="192" height="60" rx="13"/>
    </g>
    <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="26" font-weight="500" text-anchor="middle">
      <text x="54" y="279">A</text><text x="114" y="279">B</text><text x="174" y="279">R</text>
      <text x="246" y="279"><tspan fill="#4779c5">A</tspan><tspan fill="#208a80">C</tspan></text>
      <text x="330" y="279"><tspan fill="#4779c5">A</tspan><tspan fill="#208a80">D</tspan></text>
      <text x="474" y="279"><tspan fill="#4779c5">ABRA</tspan><tspan fill="#208a80">!</tspan></text>
    </g>
    <path d="M54 303C54 349 238 349 238 309" fill="none" stroke="#8da9d1" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="141" y="353" text-anchor="middle" font-size="13" fill="#6a85ad">A</text>
    <circle cx="38" cy="382" r="4" fill="#4779c5"/>
    <text x="50" y="387" font-size="13" fill="#6e7e92">Matched prefix</text>
    <circle cx="238" cy="382" r="4" fill="#208a80"/>
    <text x="250" y="387" font-size="13" fill="#6e7e92">Next symbol</text>
  </g>
</svg>
