<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
<title id="title">lzcomplexity · Pleros</title>
<desc id="description">ABRACADABRA! has six factors: A, B, R, AC, AD, ABRA!. Every factor ends with a teal symbol. At position eight, earlier text ABRACAD contains the blue matching prefix ABRA; appending the next symbol ! gives ABRA!. Entropy, Effective measure complexity and information distance for Python, Rust and the command line.</desc>
