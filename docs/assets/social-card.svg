<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">lzcomplexity · Pleros</title>
  <desc id="description">Entropy, structure and information distance. ABRACADABRA! is split into six verified LZ76 factors: A, B, R, AC, AD and ABRA!. Curved arrows mark reuse of the earlier A. Python, Rust and command-line tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf1fb"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#c5d9f9"/>
      <stop offset=".45" stop-color="#4285ed"/>
      <stop offset="1" stop-color="#c5d9f9"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f9ff"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#284773" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#8eb4ef" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1100" cy="90" r="330" fill="#dceafe" opacity=".35"/>
  <circle cx="1150" cy="50" r="230" fill="#eaf2fe" opacity=".8"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(72 56)">
      <rect width="38" height="38" rx="11" fill="#1670e9"/>
      <path d="M11 10v17h9m0-17h8l-8 17h8" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="25" font-size="17" font-weight="600" fill="#32445d" letter-spacing="2">PLEROS</text>
      <text x="164" y="25" font-size="15" fill="#67758b" letter-spacing="1.6">/ SCIENTIFIC COMPUTING</text>
    </g>
    <text x="69" y="212" font-size="91" font-weight="650" fill="#16243b" letter-spacing="-5">lzcomplexity</text>
    <text x="73" y="270" font-size="31" font-weight="400" fill="#52657e" letter-spacing="-.6">Entropy, structure &amp; information distance</text>
    <g transform="translate(73 325)" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="25" font-weight="500" text-anchor="middle">
      <path d="M39 20C39-25 340-25 340 20" fill="none" stroke="url(#line)" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M39 78C39 139 488 139 488 78" fill="none" stroke="url(#line)" stroke-width="2" marker-end="url(#arrow)"/>
      <g fill="url(#tile)" stroke="#dce5f1" filter="url(#shadow)">
        <rect x="0" y="23" width="78" height="52" rx="13"/>
        <rect x="94" y="23" width="78" height="52" rx="13"/>
        <rect x="188" y="23" width="78" height="52" rx="13"/>
        <rect x="282" y="23" width="132" height="52" rx="13"/>
        <rect x="430" y="23" width="132" height="52" rx="13"/>
        <rect x="578" y="23" width="264" height="52" rx="13"/>
      </g>
      <g fill="#526b90">
        <text x="39" y="58">A</text><text x="133" y="58">B</text><text x="227" y="58">R</text>
        <text x="348" y="58"><tspan fill="#3678d6">A</tspan><tspan>C</tspan></text>
        <text x="496" y="58"><tspan fill="#3678d6">A</tspan><tspan>D</tspan></text>
        <text x="710" y="58"><tspan fill="#3678d6">ABRA</tspan><tspan>!</tspan></text>
      </g>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#72829a">
        <text x="983" y="44">LZ76</text><text x="983" y="70">6 factors</text>
      </g>
    </g>
    <g transform="translate(74 514)">
